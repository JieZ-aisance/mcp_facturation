[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "billing-mcp"
version = "0.1.0"
description = "Serveur MCP « assistant de facturation »"
requires-python = ">=3.11"
dependencies = ["mcp>=2.3"]

[project.scripts]
billing-mcp = "billing_mcp.server:main"

[project.optional-dependencies]
test = ["pytest>=9", "pytest-asyncio>=1.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
billing_mcp = ["data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.pyright]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
